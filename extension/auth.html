<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="auth-screen">

    <!-- Animated background -->
    <div class="auth-bg">
      <div class="auth-orb auth-orb--1"></div>
      <div class="auth-orb auth-orb--2"></div>
      <div class="auth-orb auth-orb--3"></div>
      <div class="auth-grid"></div>
    </div>

    <!-- Glass card -->
    <div class="auth-container">

      <!-- Logo (src set via AUTH_CONFIG in auth.js) -->
      <div class="auth-logo">
        <img id="authLogoImg" src="logo.png" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="auth-logo-fallback">
          <i class='bx bx-target-lock'></i>
        </div>
      </div>

      <!-- Title / Subtitle (text set via AUTH_CONFIG in auth.js) -->
      <h2 class="auth-title" id="authTitle">App Name</h2>
      <p class="auth-subtitle" id="authSubtitle">Subtitle</p>

      <!-- Tabs -->
      <div class="auth-tabs" id="authTabs">
        <div class="auth-tab-indicator"></div>
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="register">Register</button>
      </div>

      <!-- Login Form -->
      <div id="loginForm" class="auth-form">
        <div class="auth-input-group">
          <div class="auth-input-icon"><i class='bx bx-user'></i></div>
          <input type="text" id="loginUsername" placeholder="Username" autocomplete="username">
        </div>
        <div class="auth-input-group">
          <div class="auth-input-icon"><i class='bx bx-lock-alt'></i></div>
          <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        </div>
        <button id="loginBtn" class="auth-btn">
          <span class="auth-btn-text">Sign In</span>
          <i class='bx bx-right-arrow-alt auth-btn-arrow'></i>
          <div class="auth-btn-shine"></div>
        </button>
      </div>

      <!-- Register Form -->
      <div id="registerForm" class="auth-form hidden">
        <div class="auth-input-group">
          <div class="auth-input-icon"><i class='bx bx-user-plus'></i></div>
          <input type="text" id="registerUsername" placeholder="Choose a Username" autocomplete="username">
        </div>
        <div class="auth-input-group">
          <div class="auth-input-icon"><i class='bx bx-lock-alt'></i></div>
          <input type="password" id="registerPassword" placeholder="Choose a Password" autocomplete="new-password">
        </div>
        <div class="auth-input-group">
          <div class="auth-input-icon"><i class='bx bx-key'></i></div>
          <input type="text" id="registerLicenseKey" placeholder="License Key">
        </div>
        <button id="registerBtn" class="auth-btn">
          <span class="auth-btn-text">Create Account</span>
          <i class='bx bx-right-arrow-alt auth-btn-arrow'></i>
          <div class="auth-btn-shine"></div>
        </button>
      </div>

      <!-- Error -->
      <div id="authError" class="auth-error"></div>

      <!-- Loading -->
      <div id="authLoading" class="auth-loading">
        <div class="auth-spinner"></div>
        <span>Please wait...</span>
      </div>

      <!-- Banned -->
      <div id="authBannedInfo" class="auth-banned-info">
        <div class="auth-banned-icon"><i class="bx bx-block"></i></div>
        <div class="auth-banned-title">Account Banned</div>
        <div class="auth-banned-text">
          The account <strong id="bannedKeyDisplay"></strong> has been banned.
        </div>
        <div class="auth-banned-contact">Contact support on Discord if you think this is an error.</div>
        <button id="bannedNewKeyBtn" class="auth-btn-secondary">Use different account</button>
      </div>

      <!-- Footer (hidden if no discordUrl in config) -->
      <div class="auth-footer" id="authFooter">
        <a id="authDiscordLink" href="#" target="_blank" class="auth-discord-link">
          <i class='bx bxl-discord-alt'></i>
          <span>Need help? Join Discord</span>
        </a>
      </div>
    </div>

    <!-- Checking overlay -->
    <div id="authChecking" class="auth-checking">
      <div class="auth-checking-content">
        <div class="auth-spinner"></div>
        <span>Verifying your account...</span>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
